name: odyssey-watch

on:
  schedule:
    - cron: "*/20 * * * *"   # кожныя 20 хвілін (UTC)
  workflow_dispatch:          # кнопка "Run workflow" для ручнога запуску

permissions:
  contents: write             # каб камітаваць state.json назад у рэпо

concurrency:
  group: odyssey-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Праверыць сеансы
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CINEMA_ID: "1052"          # Praha Flora
          FILM_QUERY: "odys"
          REQUIRE_ATTR: "70-mm"
          DAYS_AHEAD: "120"
          # LOW_SEATS_RATIO: "0.05"  # раскаменціць, каб дадаткова алертыла пра "мала месцаў"
        run: python odyssey_watch.py

      - name: Захаваць стан
        run: |
          git config user.name "odyssey-bot"
          git config user.email "odyssey-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
